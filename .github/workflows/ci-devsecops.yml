name: LunarOps CI & DevSecOps Pipeline

on:
  push:
    branches: [main, devsecops/setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-frontend:
    name: Frontend Build & Typecheck (Next.js 16)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npm run build

  test-backend:
    name: Scientific Python & FastAPI Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          PYTHONPATH=. pytest -v backend/tests/test_api.py
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build frontend
        run: docker build -t lunarops-frontend:ci -f Dockerfile .

      - name: Build backend
        run: docker build -t lunarops-backend:ci -f backend/Dockerfile .

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: lunarops-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: lunarops-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  security-gitleaks:
    name: DevSecOps — Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       

  security-semgrep:
    name: DevSecOps — Static Application Security Testing (Semgrep SAST)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Semgrep Security Rules
        run: semgrep scan --config auto --error --exclude "node_modules" --exclude ".next"
        continue-on-error: true

  security-trivy:
    name: DevSecOps — Vulnerability & Misconfig Scan (Aqua Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Trivy Repository Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: '1'

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.10.5"

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -diff

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate -no-color
        
