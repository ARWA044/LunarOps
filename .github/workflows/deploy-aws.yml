name: LunarOps - AWS Deploy

on:
  push:
    branches:
      - devsecops/setup
    paths:
      - "src/**"
      - "backend/**"
      - "public/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "tsconfig.json"
      - ".github/workflows/deploy-aws.yml"
  pull_request:
    branches:
      - devsecops/setup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunarops-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify frontend and backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test FastAPI
        run: PYTHONPATH=. python -m pytest -q backend/tests/test_api.py

      - name: Build frontend image
        run: docker build --platform linux/amd64 -t lunarops-frontend:verify -f Dockerfile .

      - name: Build backend image with SPICE kernels
        run: docker build --platform linux/amd64 -t lunarops-backend:verify -f backend/Dockerfile .

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: lunarops-frontend:verify
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: lunarops-backend:verify
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy-backend:
    name: Deploy FastAPI SPICE backend
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/devsecops/setup'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: lunarops-backend
      ECS_CLUSTER: lunarops-production-cluster
      ECS_SERVICE: lunarops-backend-service
      ECS_TASK_FAMILY: lunarops-production-backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "783112293087"

      - name: Verify AWS account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "783112293087"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@62f4f872db3836360b72999f4b87f1ff13310f3a

      - name: Build and push backend image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Backend image already exists in immutable ECR repository"
          else
            docker build --platform linux/amd64 -t "$IMAGE" -f backend/Dockerfile .
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > backend-task-definition.json

      - name: Render backend task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: backend-task-definition.json
          container-name: backend
          image: ${{ steps.image.outputs.image }}

      - name: Deploy backend ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Verify live FastAPI SPICE API through CloudFront
        env:
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: |
          set -euo pipefail
          test -n "$WEBSITE_URL"
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors \
            "${WEBSITE_URL%/}/api/compare" -o backend-response.json
          jq -e '.engine == "spiceypy-de421" and (.siteA.telemetry | length > 0) and (.siteB.telemetry | length > 0)' backend-response.json

  deploy-frontend:
    name: Deploy Next.js frontend
    needs: deploy-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/devsecops/setup'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: lunarops-frontend
      ECS_CLUSTER: lunarops-production-cluster
      ECS_SERVICE: lunarops-frontend-service
      ECS_TASK_FAMILY: lunarops-production-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "783112293087"

      - name: Verify AWS account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "783112293087"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@62f4f872db3836360b72999f4b87f1ff13310f3a

      - name: Build and push frontend image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Frontend image already exists in immutable ECR repository"
          else
            docker build --platform linux/amd64 -t "$IMAGE" -f Dockerfile .
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > frontend-task-definition.json

      - name: Render frontend task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: frontend-task-definition.json
          container-name: frontend
          image: ${{ steps.image.outputs.image }}

      - name: Deploy frontend ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Smoke test website and scientific API
        env:
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: |
          set -euo pipefail
          test -n "$WEBSITE_URL"
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors \
            "${WEBSITE_URL%/}/" -o frontend-response.html
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors \
            "${WEBSITE_URL%/}/api/compare" -o comparison-response.json
          jq -e '.engine == "spiceypy-de421"' comparison-response.json
          echo "LunarOps frontend and SPICE backend deployed successfully"
